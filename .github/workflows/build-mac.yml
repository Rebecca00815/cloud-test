name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [claude/dreamy-turing-h4ehzp]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Morse-Generator-mac
          path: |
            dist/*.dmg
            dist/*.zip
